services:
  crosslan:
    build: .
    ports:
      - "${PORT:-6100}:${PORT:-6100}"
    environment:
      NODE_ENV: production
      CROSSLAN_DEPLOYMENT: docker
      CROSSLAN_ADVERTISED_IP: ${CROSSLAN_ADVERTISED_IP:-}
      PORT: ${PORT:-6100}
      MDNS_SERVICE_NAME: CrossLAN
      CROSSLAN_SAVE_DIR: /data/CrossLAN
      CROSSLAN_CONFIG: /config/crosslan.json
      CROSSLAN_RELAY_BUFFER_MB: ${CROSSLAN_RELAY_BUFFER_MB:-256}
    volumes:
      - "${CROSSLAN_HOST_SAVE_DIR:-./docker-data}:/data/CrossLAN"
      - ./docker-config:/config
    restart: unless-stopped
