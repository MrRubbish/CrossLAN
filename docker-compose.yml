services:
  crosslan:
    build: .
    ports:
      - "${PORT:-8765}:${PORT:-8765}"
    environment:
      NODE_ENV: production
      CROSSLAN_DEPLOYMENT: docker
      PORT: ${PORT:-8765}
      MDNS_SERVICE_NAME: CrossLAN
      CROSSLAN_SAVE_DIR: /data/CrossLAN
      CROSSLAN_CONFIG: /config/crosslan.json
      CROSSLAN_RELAY_BUFFER_MB: ${CROSSLAN_RELAY_BUFFER_MB:-256}
    volumes:
      - ${USERPROFILE}/Downloads/CrossLAN:/data/CrossLAN
      - ./docker-config:/config
    restart: unless-stopped
